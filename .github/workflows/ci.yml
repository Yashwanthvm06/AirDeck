name: AirDesk CI / Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDesk-Android-Debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk

  build-windows:
    name: Build Windows Companion
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Windows Companion
        working-directory: windows-companion
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ../release-builds/windows

      - name: Upload Windows Companion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirDesk-Windows-Companion
          path: release-builds/windows/
